<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Input Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0a0a0a; color: white; }
    </style>
</head>
<body class="p-5">
    <div class="max-w-md mx-auto">
        <h1 class="text-2xl mb-4">Current Weight Input (Issue)</h1>
        <div class="bg-gray-900 rounded-3xl p-6 mb-8">
            <label class="text-xs uppercase font-bold mb-2 block">Load (kg)</label>
            <div class="relative flex items-center gap-2">
                <button class="h-14 w-12 rounded-xl bg-gray-800 flex items-center justify-center">-</button>
                <input 
                    type="number" 
                    inputMode="decimal"
                    class="bg-gray-800 rounded-xl flex-1 h-14 px-4 text-white font-mono text-lg text-center outline-none" 
                    value="100.5" 
                    placeholder="0"
                />
                <button class="h-14 w-12 rounded-xl bg-gray-800 flex items-center justify-center">+</button>
            </div>
        </div>

        <h1 class="text-2xl mb-4">Fixed Weight Input (Solution)</h1>
        <div class="bg-gray-900 rounded-3xl p-6">
            <label class="text-xs uppercase font-bold mb-2 block">Load (kg)</label>
            <div class="relative flex items-center gap-2">
                <button class="h-14 w-12 rounded-xl bg-gray-800 flex items-center justify-center">-</button>
                <input 
                    type="number" 
                    inputMode="decimal"
                    class="bg-gray-800 rounded-xl flex-1 h-14 px-3 text-white font-mono text-base text-center outline-none min-w-0" 
                    value="100.5" 
                    placeholder="0"
                />
                <button class="h-14 w-12 rounded-xl bg-gray-800 flex items-center justify-center">+</button>
            </div>
        </div>
    </div>
</body>
</html>
