<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Monochrome mask icon for Safari pinned tabs -->
  <!-- Single color, will be tinted by OS -->

  <g transform="translate(256, 256)">
    <!-- Center bar -->
    <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#000"/>

    <!-- Left weight stack -->
    <rect x="-160" y="-56" width="40" height="112" rx="10" fill="#000"/>
    <rect x="-130" y="-70" width="28" height="140" rx="8" fill="#000"/>

    <!-- Right weight stack -->
    <rect x="102" y="-70" width="28" height="140" rx="8" fill="#000"/>
    <rect x="120" y="-56" width="40" height="112" rx="10" fill="#000"/>
  </g>

  <!-- Progress indicator -->
  <rect x="116" y="415" width="280" height="10" rx="5" fill="#000"/>
</svg>
