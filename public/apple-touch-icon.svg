<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background - Apple applies its own mask/rounding -->
  <rect width="180" height="180" fill="url(#bgGrad)"/>

  <!-- Main icon -->
  <g transform="translate(90, 86)">
    <!-- Center bar -->
    <rect x="-36" y="-5" width="72" height="10" rx="5" fill="#3f3f46"/>

    <!-- Left weight -->
    <g filter="url(#glow)">
      <rect x="-56" y="-20" width="14" height="40" rx="3.5" fill="url(#accent)"/>
      <rect x="-46" y="-25" width="10" height="50" rx="3" fill="url(#accent)"/>
    </g>

    <!-- Right weight -->
    <g filter="url(#glow)">
      <rect x="36" y="-25" width="10" height="50" rx="3" fill="url(#accent)"/>
      <rect x="42" y="-20" width="14" height="40" rx="3.5" fill="url(#accent)"/>
    </g>

    <!-- Grip lines -->
    <rect x="-11" y="-3" width="3" height="6" rx="1.5" fill="#52525b"/>
    <rect x="-4" y="-3" width="3" height="6" rx="1.5" fill="#52525b"/>
    <rect x="3" y="-3" width="3" height="6" rx="1.5" fill="#52525b"/>
    <rect x="10" y="-3" width="3" height="6" rx="1.5" fill="#52525b"/>
  </g>

  <!-- Progress bar -->
  <g transform="translate(90, 146)">
    <rect x="-50" y="-2.5" width="100" height="5" rx="2.5" fill="#27272a"/>
    <rect x="-50" y="-2.5" width="68" height="5" rx="2.5" fill="url(#accent)"/>
  </g>
</svg>
