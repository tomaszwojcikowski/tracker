<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="42" fill="url(#bgGrad)"/>

  <!-- Main icon -->
  <g transform="translate(96, 92)">
    <!-- Center bar -->
    <rect x="-38" y="-5" width="76" height="10" rx="5" fill="#3f3f46"/>

    <!-- Left weight -->
    <g filter="url(#glow)">
      <rect x="-60" y="-21" width="15" height="42" rx="4" fill="url(#accent)"/>
      <rect x="-49" y="-26" width="10" height="52" rx="3" fill="url(#accent)"/>
    </g>

    <!-- Right weight -->
    <g filter="url(#glow)">
      <rect x="39" y="-26" width="10" height="52" rx="3" fill="url(#accent)"/>
      <rect x="45" y="-21" width="15" height="42" rx="4" fill="url(#accent)"/>
    </g>

    <!-- Grip -->
    <rect x="-12" y="-3" width="3" height="6" rx="1.5" fill="#52525b"/>
    <rect x="-4" y="-3" width="3" height="6" rx="1.5" fill="#52525b"/>
    <rect x="4" y="-3" width="3" height="6" rx="1.5" fill="#52525b"/>
    <rect x="12" y="-3" width="3" height="6" rx="1.5" fill="#52525b"/>
  </g>

  <!-- Progress bar -->
  <g transform="translate(96, 156)">
    <rect x="-52" y="-3" width="104" height="6" rx="3" fill="#27272a"/>
    <rect x="-52" y="-3" width="70" height="6" rx="3" fill="url(#accent)"/>
  </g>
</svg>
