                            onClick={handleClearChatHistory}
                            className="w-full h-12 rounded-xl bg-sys-surfaceHigh text-white font-medium flex items-center justify-center gap-2 active:scale-95 transition-transform border border-white/5"
                        >
                            <i data-lucide="trash-2" width="18"></i>
                            <span>Clear Chat History</span>
                        </button>
                        {chatHistoryMessage && (
                            <div className="mt-4 p-3 rounded-xl bg-sys-accent/10 border border-sys-accent/30 text-sys-accent text-sm text-center">
                                {chatHistoryMessage}
                            </div>
                        )}
                    </div>
                    
                    <div className="bg-sys-surface rounded-3xl border border-white/5 p-6">
                        <h3 className="text-base font-bold text-white mb-3">About Gemini Integration</h3>
                        <p className="text-sm text-sys-onSurfaceVar leading-relaxed mb-3">
                            When you finish a workout, the app automatically sends a summary to Google's Gemini AI for analysis. Gemini maintains context across all your workouts in a continuous chat conversation. Each submission includes:
                        </p>
                        <ul className="text-sm text-sys-onSurfaceVar space-y-2 ml-4 mb-3">
                            <li className="flex items-start gap-2">
                                <span className="text-sys-accent">•</span>
                                <span>Week and day information</span>
                            </li>
                            <li className="flex items-start gap-2">
                                <span className="text-sys-accent">•</span>
                                <span>Completed exercises with sets, reps, and weights</span>
                            </li>
                            <li className="flex items-start gap-2">
                                <span className="text-sys-accent">•</span>
                                <span>RPE (Rate of Perceived Exertion) data</span>
                            </li>
                            <li className="flex items-start gap-2">
                                <span className="text-sys-accent">•</span>
                                <span>Workout completion timestamp</span>
                            </li>
                        </ul>
                        <p className="text-xs text-sys-onSurfaceVar leading-relaxed">
                            Note: Gemini remembers your previous workouts and provides personalized coaching based on your training history. The API response is logged to the browser console for your review.
                        </p>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('train');
            const [viewMode, setViewMode] = useState('tab'); 
            const [currentWeek, setCurrentWeek] = useState(1);
            const [activeDay, setActiveDay] = useState(1);

            useEffect(() => {
                const savedWeek = localStorage.getItem('tracker_week');
                if (savedWeek) setCurrentWeek(parseInt(savedWeek));
            }, []);

            useEffect(() => {
                localStorage.setItem('tracker_week', currentWeek);
            }, [currentWeek]);

            // Initialize Lucide icons when view or tab changes
            useEffect(() => {
                lucide.createIcons();
            }, [viewMode, activeTab]);

            // Handle browser back button
            useEffect(() => {
                const handlePopState = (event) => {
                    if (event.state && event.state.viewMode) {
                        setViewMode(event.state.viewMode);
                        if (event.state.activeTab) {
                            setActiveTab(event.state.activeTab);
                        }
                        if (event.state.activeDay) {
                            setActiveDay(event.state.activeDay);
                        }
                    } else {
                        // No state, go back to tab view
                        setViewMode('tab');
                    }
                };

                window.addEventListener('popstate', handlePopState);
                
                // Set initial state only if no state exists
                if (!window.history.state || !window.history.state.viewMode) {
                    window.history.replaceState({ viewMode: 'tab', activeTab: 'train' }, '', window.location.href);
                }

                return () => {
                    window.removeEventListener('popstate', handlePopState);
                };
            }, []);

            const startWorkout = (day) => {
                setActiveDay(day);
                setViewMode('workout');
                // Push new state to history when entering workout mode
                window.history.pushState(
                    { viewMode: 'workout', activeDay: day, currentWeek },
                    '',
                    window.location.href
                );
            };

            const goBack = () => {
                // Go back in browser history
                window.history.back();
            };

            return (
                <div className="min-h-screen bg-sys-black text-white font-sans flex flex-col max-w-md mx-auto relative">
                    <TopAppBar 
                        title={viewMode === 'workout' ? `Day ${activeDay}` : (activeTab === 'train' ? 'Dashboard' : activeTab === 'history' ? 'History' : activeTab === 'coach' ? 'AI Coach' : 'Settings')}
                        subtitle={viewMode === 'workout' ? `Week ${currentWeek}` : (activeTab === 'train' ? 'OnePlus Strength' : '')}
                        showBack={viewMode === 'workout'}
                        onBack={goBack}
                    />

                    {viewMode === 'workout' ? (
                        <WorkoutPlayer week={currentWeek} day={activeDay} onComplete={goBack} />
                    ) : (
                        <>
                            {activeTab === 'train' && <Dashboard currentWeek={currentWeek} setCurrentWeek={setCurrentWeek} onStartWorkout={startWorkout} />}
                            {activeTab === 'history' && <HistoryView />}
                            {activeTab === 'coach' && <CoachView />}
                            {activeTab === 'profile' && <SettingsView />}
                            <NavigationBar activeTab={activeTab} onTabChange={setActiveTab} />
                        </>
                    )}
                </div>
            );
        };

        // Loading component to show while fetching data
        const LoadingScreen = () => (
            <div className="min-h-screen bg-sys-black text-white flex items-center justify-center">
                <div className="text-center">
                    <div className="text-2xl font-bold mb-2">Loading...</div>
                    <div className="text-sys-onSurfaceVar">Loading workout schedule</div>
                </div>
            </div>
        );

        // Error component for loading failures
        const ErrorScreen = ({ message }) => (
            <div className="min-h-screen bg-sys-black text-white flex items-center justify-center p-5">
                <div className="text-center">
                    <div className="text-2xl font-bold mb-2 text-red-500">Error</div>
                    <div className="text-sys-onSurfaceVar">{message}</div>
                </div>
            </div>
        );

        // Initialize the app with loading state
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LoadingScreen />);

        // Load schedule data from JSON file
        fetch('full-schedule.json')
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                // Validate data structure
                if (!Array.isArray(data) || data.length === 0) {
                    throw new Error('Invalid schedule data: expected non-empty array');
                }
                
                // Basic validation of first item
                const firstItem = data[0];
                const requiredKeys = ['w', 'd', 'ex', 's', 'r', 'n'];
                const hasRequiredKeys = requiredKeys.every(key => key in firstItem);
                if (!hasRequiredKeys) {
                    throw new Error('Invalid schedule data: missing required properties');
                }
                
                // Assign the loaded data to RAW_SCHEDULE
                RAW_SCHEDULE = data;
                
                // Build the complete schedule with standard warmups/cooldowns
                buildCompleteSchedule();
                
                // Re-render with the actual app now that data is loaded
                root.render(<App />);
            })
            .catch(error => {
                console.error('Error loading schedule:', error);
                root.render(<ErrorScreen message="Failed to load workout schedule data" />);
            });
    </script>
</body>
</html>
