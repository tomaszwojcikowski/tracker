<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V26.10 Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        opBlack: '#000000',
                        opGray: '#121212',
                        opRed: '#EB0029',
                        opText: '#E5E5E5',
                        opSub: '#9CA3AF'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000000; color: #E5E5E5; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- DATA ENGINE ---
        
        const PROGRAM_DATA = {
            title: "20-Week Integrated Strength (V26.10)",
            blocks: [
                { id: 1, name: "Foundation (Ladders)", weeks: [1, 2, 3, 4] },
                { id: 2, name: "Intensification (EMOM)", weeks: [5, 6, 7, 8] },
                { id: 3, name: "Neutral Grip (Clusters)", weeks: [9, 10, 11, 12] },
                { id: 4, name: "Accumulation (AMRAP)", weeks: [13, 14, 15, 16] },
                { id: 5, name: "Peak & Taper", weeks: [17, 18, 19, 20] }
            ],
            getWorkout: (week, day) => {
                let workout = {
                    title: `Week ${week} Day ${day}`,
                    focus: "General Strength",
                    prep: ["Rower Protocol (5 min)", "Global Tendon Prep"],
                    sections: []
                };

                const isDeload = [4, 8, 12, 16, 19].includes(week);

                // --- DAY 1: VOLUME ---
                if (day === 1) {
                    workout.title = "Day 1: Pull Volume";
                    
                    // A1. Pulling Variations (Block Dependent)
                    let pullExercise = {};
                    if (week <= 4) {
                        // Block 1: Ladders
                        const sets = week === 1 ? 4 : (week === 4 ? 3 : 5);
                        pullExercise = {
                            name: "A1. Pull-Up Ladders",
                            prescription: week === 4 ? "3 x (1-2-3) (Deload)" : `${sets} x (1-2-3) reps`,
                            inputs: ["ladders"],
                            sets: sets,
                            isBodyweight: true,
                            rest: 120
                        };
                    } else if (week <= 8) {
                        // Block 2: EMOMs
                        const emomScheme = week === 5 ? "8 x 4" : week === 6 ? "9 x 4" : week === 7 ? "10 x 3" : "6 x 3";
                        pullExercise = {
                            name: "A1. Pull-Up EMOM",
                            prescription: `EMOM: ${emomScheme} reps`,
                            inputs: ["sets"], // Using sets to track rounds
                            sets: week === 5 ? 8 : week === 6 ? 9 : week === 7 ? 10 : 6,
                            isBodyweight: true,
                            rest: 60 // EMOM interval
                        };
                    } else if (week <= 12) {
                        // Block 3: Clusters (Neutral Grip)
                        const clusterScheme = week === 9 ? "4 x (3-3-3)" : week === 10 ? "4 x (4-3-3)" : week === 11 ? "5 x (3-3-3)" : "3 x (3-3-3)";
                        pullExercise = {
                            name: "A1. Neutral Grip Clusters",
                            prescription: `${clusterScheme} (Rest 15s between mini-sets)`,
                            inputs: ["sets"],
                            sets: week === 11 ? 5 : (week === 12 ? 3 : 4),
                            isBodyweight: true,
                            rest: 180
                        };
                    } else if (week <= 16) {
                         // Block 4: AMRAPs
                         const scheme = week === 16 ? "2 x AMRAP-4" : "3 x AMRAP-2";
                         pullExercise = {
                            name: "A1. Pull-Up AMRAPs",
                            prescription: scheme,
                            inputs: ["reps"],
                            sets: week === 16 ? 2 : 3,
                            isBodyweight: true,
                            rest: 180
                         };
                    } else {
                        // Block 5: Taper
                        pullExercise = {
                            name: "A1. Taper Pull-Ups",
                            prescription: "3 x (AMRAP-1)",
                            inputs: ["reps"],
                            sets: 3,
                            isBodyweight: true,
                            rest: 120
                        };
                    }

                    // Skill Work
                    const skillExercise = week <= 4 ? { name: "Crow Stand", prescription: "3 x 10-20s" } : 
                                          week <= 8 ? { name: "Tuck Planche Hold", prescription: "3 x 6-8s" } :
                                          { name: "Handstand Hold", prescription: "3 x 20s" };

                    workout.sections = [
                        { type: "skill", name: "Skill Practice", exercises: [{ ...skillExercise, sets: 3, rest: 60, isBodyweight: true }] },
                        {
                            type: "main",
                            name: "Primary Work",
                            exercises: [
                                pullExercise,
                                { 
                                    name: week <= 8 ? "B1. Ring Rows" : "B1. Feet-Elevated Rows", 
                                    prescription: "3 x 10-15 (2-1-1-0 Tempo)", 
                                    inputs: ["reps", "rpe"], 
                                    sets: 3, 
                                    rest: 90, 
                                    isBodyweight: true 
                                },
                                { 
                                    name: week <= 4 ? "B2. Incline Push-Ups" : "B2. Parallette Push-Ups", 
                                    prescription: "3 x 10", 
                                    inputs: ["reps", "rpe"], 
                                    sets: 3, 
                                    rest: 90, 
                                    isBodyweight: true 
                                },
                                { 
                                    name: "C1. Hollow Rocks", 
                                    prescription: "3 x 25s", 
                                    inputs: ["time"], 
                                    sets: 3, 
                                    rest: 60, 
                                    isBodyweight: true 
                                }
                            ]
                        },
                        {
                            type: "cooldown",
                            name: "Cool Down",
                            exercises: [
                                { name: "Passive Dead Hang", prescription: "30-60s", sets: 1, isBodyweight: true, rest: 0 },
                                { name: "Butcher's Block", prescription: "60s", sets: 1, isBodyweight: true, rest: 0 },
                                { name: "Cobra Stretch", prescription: "60s", sets: 1, isBodyweight: true, rest: 0 }
                            ]
                        }
                    ];
                } 
                
                // --- DAY 2: RECOVERY ---
                else if (day === 2) {
                    workout.title = "Day 2: Active Recovery";
                    workout.sections = [
                         {
                            type: "main",
                            name: "Mobility & Prehab",
                            exercises: [
                                { name: "Knee-to-Wall Ankle Mob", prescription: "2 mins/side", sets: 1, rest: 0, isBodyweight: true },
                                { name: "Tibialis Wall Raises", prescription: "3 x 15-20", sets: 3, rest: 30, isBodyweight: true },
                                { name: "Deep Squat Iso-Hold", prescription: "2 x 30s", sets: 2, rest: 60, isBodyweight: true },
                                { name: "Band Internal Rotations", prescription: "2 x 20/side", sets: 2, rest: 30, isBodyweight: false }
                            ]
                        }
                    ];
                }

                // --- DAY 3: LEGS & POSTERIOR ---
                else if (day === 3) {
                    workout.title = "Day 3: Posterior Chain";
                    
                    // Goblet Squat Progression
                    let gobletPrescription = "3 x 10";
                    if (week % 4 === 2) gobletPrescription = "3 x 12 (Moderate)";
                    if (week % 4 === 3) gobletPrescription = "3 x 10 (Heavier)";
                    if (week % 4 === 0) gobletPrescription = "2 x 10 (Deload)";

                    // Hamstring Accessory
                    const hamstringEx = week <= 4 ? "Weighted Glute Bridge" : "Rower Leg Curls";

                    workout.sections = [
                        {
                            type: "main",
                            name: "Strength",
                            exercises: [
                                { name: "A1. RDL", prescription: "4 x 8-10", inputs: ["weight", "reps"], sets: 4, rest: 120, isBodyweight: false },
                                { name: `B1. ${hamstringEx}`, prescription: "3 x 10-12", inputs: ["weight", "reps"], sets: 3, rest: 90, isBodyweight: week > 4 }, // Rower curls are BW
                                { name: "B2. Goblet Squats", prescription: gobletPrescription, inputs: ["weight", "reps"], sets: isDeload ? 2 : 3, rest: 90, isBodyweight: false },
                                { name: "C1. Face Pulls", prescription: "3 x 15-20", inputs: ["weight", "reps"], sets: 3, rest: 60, isBodyweight: false }
                            ]
                        }
                    ];
                } 
                
                // --- DAY 5: INTENSITY ---
                else if (day === 5) {
                    workout.title = "Day 5: Intensity";
                    
                    // Pull Up Progression
                    let pullSets = 3;
                    let pullReps = 5;
                    let pullName = "Weighted Pull-Ups";

                    if (week <= 4) {
                        // Block 1
                        pullSets = week === 4 ? 2 : 3;
                        pullReps = week === 4 ? 3 : 5;
                    } else if (week <= 8) {
                        // Block 2 (Heavier)
                        if (week === 5) { pullSets = 2; pullReps = 4; }
                        if (week === 6) { pullSets = 1; pullReps = 4; } // Heavy single set
                        if (week === 7) { pullSets = 3; pullReps = 3; }
                        if (week === 8) { pullSets = 2; pullReps = 3; }
                    } else if (week <= 12) {
                        // Block 3 (Neutral)
                        pullName = "Neutral Grip Weighted Pull-Ups";
                        pullSets = week === 12 ? 2 : 2;
                        pullReps = week === 12 ? 3 : 4;
                    }

                    // Core Accessory (Auto-regulated)
                    const coreEx = isDeload || week === 2 ? "Dead Bugs" : "Weighted V-Ups";

                    workout.sections = [
                        {
                            type: "main",
                            name: "Primary Lifts",
                            exercises: [
                                { name: `A1. ${pullName}`, prescription: `${pullSets} x ${pullReps}`, inputs: ["weight", "reps", "rpe"], sets: pullSets, rest: 180, isBodyweight: false },
                                { name: "B1. Dips", prescription: week > 4 ? "Weighted (3 x 5)" : "Bodyweight (3 x 10)", inputs: ["weight", "reps"], sets: 3, rest: 120, isBodyweight: week <= 4 }
                            ]
                        },
                        {
                            type: "main",
                            name: "Accessory (10m Cap)",
                            exercises: [
                                { name: "Split Squats", prescription: "8 reps/leg", sets: 3, rest: 60, isBodyweight: true },
                                { name: coreEx, prescription: "12-15 reps", sets: 3, rest: 60, isBodyweight: coreEx === "Dead Bugs" }
                            ]
                        }
                    ];
                } else {
                     // Fallback
                     workout.sections = [{type: "main", name: "Recovery", exercises: []}];
                }
                
                return workout;
            }
        };

        // --- ICONS & HELPERS ---
        const Icon = ({ name, size = 24, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} width={size} height={size}></i>;
        };

        const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        };

        // --- COMPONENTS ---

        // 1. TIMER COMPONENT
        const GlobalTimer = ({ initialTime, isRunning, onStop, onReset, onAdd }) => {
            if (!isRunning && initialTime === 0) return null;

            return (
                <div className="fixed bottom-0 left-0 right-0 bg-opGray border-t border-gray-800 p-4 z-50 shadow-[0_-5px_20px_rgba(0,0,0,0.8)] animate-in slide-in-from-bottom duration-300 safe-pb">
                    <div className="max-w-md mx-auto flex items-center justify-between">
                        <div className="flex flex-col">
                            <span className="text-xs text-gray-500 uppercase font-bold tracking-widest">Rest Timer</span>
                            <span className={`text-3xl font-mono font-bold ${initialTime < 10 ? 'text-opRed animate-pulse' : 'text-white'}`}>
                                {formatTime(initialTime)}
                            </span>
                        </div>
                        <div className="flex items-center gap-3">
                            <button onClick={() => onAdd(30)} className="p-3 rounded-full bg-gray-800 text-gray-300 hover:bg-gray-700 font-bold text-xs">+30s</button>
                            <button onClick={onStop} className="p-3 rounded-full bg-opRed/20 text-opRed hover:bg-opRed/30">
                                <Icon name="x" size={24} />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 2. HEADER
        const Header = ({ title, subtitle, onBack }) => (
            <div className="bg-opBlack border-b border-opGray p-4 sticky top-0 z-40 bg-opacity-95 backdrop-blur-md">
                <div className="flex items-center gap-4">
                    {onBack && (
                        <button onClick={onBack} className="p-2 bg-opGray rounded-full hover:bg-opRed transition-colors">
                            <Icon name="arrow-left" size={20} />
                        </button>
                    )}
                    <div>
                        <h1 className="text-lg font-bold text-white tracking-tight">{title}</h1>
                        {subtitle && <p className="text-xs text-opRed uppercase font-semibold tracking-widest">{subtitle}</p>}
                    </div>
                </div>
            </div>
        );

        // 3. WORKOUT PLAYER
        const WorkoutPlayer = ({ week, day, onComplete }) => {
            const workout = PROGRAM_DATA.getWorkout(week, day);
            const [logs, setLogs] = useState({});
            const [prepDone, setPrepDone] = useState({ rower: false, tendon: false });
            
            // Timer State
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);

            useEffect(() => {
                const savedkey = `session_w${week}d${day}`;
                const saved = localStorage.getItem(savedkey);
                if (saved) setLogs(JSON.parse(saved));
                // Reset logs if none exist for this specific week/day combo
                if (!saved) setLogs({});
            }, [week, day]);

            // Timer Tick
            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) {
                    interval = setInterval(() => {
                        setTimerSeconds(s => s - 1);
                    }, 1000);
                } else if (timerSeconds === 0) {
                    setTimerActive(false);
                }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const startTimer = (duration) => {
                setTimerSeconds(duration);
                setTimerActive(true);
            };

            const saveLog = (id, field, value) => {
                const newLogs = { ...logs, [id]: { ...logs[id], [field]: value } };
                setLogs(newLogs);
                localStorage.setItem(`session_w${week}d${day}`, JSON.stringify(newLogs));
            };

            // Helper to toggle set completion
            const toggleSet = (exId, setIndex, totalSets) => {
                const currentSets = logs[exId]?.sets || new Array(totalSets).fill(false);
                const newSets = [...currentSets];
                newSets[setIndex] = !newSets[setIndex];
                saveLog(exId, 'sets', newSets);
            };

            return (
                <div className="flex-1 overflow-y-auto pb-32 safe-pb">
                    <div className="p-4 space-y-6">
                        
                        {/* Prep Section */}
                        <div className="bg-opGray rounded-xl p-4 border border-gray-800">
                            <h3 className="text-sm font-bold text-opSub mb-3 uppercase">Pre-Flight Checks</h3>
                            <label className="flex items-center gap-3 mb-2 p-2 hover:bg-gray-900 rounded cursor-pointer">
                                <input type="checkbox" checked={prepDone.rower} onChange={() => setPrepDone(p => ({...p, rower: !p.rower}))} className="accent-opRed w-5 h-5" />
                                <span className={prepDone.rower ? "text-opRed line-through" : "text-white"}>Rower Protocol (5 min)</span>
                            </label>
                            <label className="flex items-center gap-3 p-2 hover:bg-gray-900 rounded cursor-pointer">
                                <input type="checkbox" checked={prepDone.tendon} onChange={() => setPrepDone(p => ({...p, tendon: !p.tendon}))} className="accent-opRed w-5 h-5" />
                                <span className={prepDone.tendon ? "text-opRed line-through" : "text-white"}>Global Tendon Prep</span>
                            </label>
                        </div>

                        {/* Workout Sections */}
                        {workout.sections.map((section, sIdx) => (
                            <div key={sIdx} className="space-y-3">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xl font-bold text-white">{section.name}</h2>
                                    <span className="text-xs px-2 py-1 bg-gray-800 rounded text-gray-400 uppercase">{section.type}</span>
                                </div>

                                {section.exercises?.map((ex, eIdx) => {
                                    const totalSets = ex.sets || 3;
                                    // Generate a unique ID based on name if ID is missing
                                    const exId = ex.id || ex.name.replace(/\s+/g, '_').toLowerCase();
                                    const completedSets = logs[exId]?.sets || [];
                                    
                                    return (
                                        <div key={eIdx} className="bg-opGray rounded-xl p-4 border border-gray-800 shadow-lg relative overflow-hidden">
                                            {/* Exercise Header */}
                                            <div className="flex justify-between items-start mb-3">
                                                <div>
                                                    <h3 className="font-bold text-lg text-white">{ex.name}</h3>
                                                    <p className="text-sm text-opRed font-mono mt-1">{ex.prescription}</p>
                                                </div>
                                                {ex.rest > 0 && (
                                                    <button 
                                                        onClick={() => startTimer(ex.rest)}
                                                        className="flex items-center gap-1 px-2 py-1 bg-gray-800 hover:bg-gray-700 rounded text-xs text-gray-300 border border-gray-700"
                                                    >
                                                        <Icon name="timer" size={12} />
                                                        Rest {ex.rest}s
                                                    </button>
                                                )}
                                            </div>

                                            <div className="space-y-4">
                                                {/* SET BUTTONS GRID */}
                                                <div className={`grid gap-2 ${totalSets > 6 ? 'grid-cols-5' : 'grid-cols-4'}`}>
                                                    {Array.from({ length: totalSets }).map((_, i) => {
                                                        const isDone = completedSets[i];
                                                        return (
                                                            <button
                                                                key={i}
                                                                onClick={() => toggleSet(exId, i, totalSets)}
                                                                className={`
                                                                    h-10 rounded-lg font-bold text-sm border transition-all duration-200 flex items-center justify-center gap-1
                                                                    ${isDone 
                                                                        ? 'bg-opRed border-opRed text-white shadow-[0_0_15px_rgba(235,0,41,0.3)]' 
                                                                        : 'bg-gray-900/50 border-gray-700 text-gray-500 hover:border-gray-500'}
                                                                `}
                                                            >
                                                                {isDone ? <Icon name="check" size={14} /> : (i + 1)}
                                                            </button>
                                                        );
                                                    })}
                                                </div>

                                                {/* INPUT FIELDS (Conditional) */}
                                                {ex.inputs && (
                                                    <div className="grid grid-cols-2 gap-3 pt-2 border-t border-gray-800/50">
                                                        {/* WEIGHT INPUT - HIDDEN IF BODYWEIGHT */}
                                                        {!ex.isBodyweight && ex.inputs.includes("weight") && (
                                                            <div className="bg-black rounded px-3 py-2 border border-gray-800">
                                                                <label className="text-[10px] text-gray-500 uppercase font-bold block mb-1">Load (Kg)</label>
                                                                <input 
                                                                    type="number" 
                                                                    placeholder="0"
                                                                    value={logs[exId]?.weight || ''}
                                                                    onChange={(e) => saveLog(exId, 'weight', e.target.value)}
                                                                    className="bg-transparent text-white text-lg w-full focus:outline-none font-mono placeholder-gray-700"
                                                                />
                                                            </div>
                                                        )}

                                                        {/* RPE INPUT */}
                                                        {ex.inputs.includes("rpe") && (
                                                            <div className="bg-black rounded px-3 py-2 border border-gray-800">
                                                                <label className="text-[10px] text-gray-500 uppercase font-bold block mb-1">RPE (1-10)</label>
                                                                <input 
                                                                    type="number" 
                                                                    placeholder="-"
                                                                    value={logs[exId]?.rpe || ''}
                                                                    onChange={(e) => saveLog(exId, 'rpe', e.target.value)}
                                                                    className="bg-transparent text-white text-lg w-full focus:outline-none font-mono placeholder-gray-700"
                                                                />
                                                            </div>
                                                        )}
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        ))}
                    </div>

                    <div className="p-4">
                        <button onClick={onComplete} className="w-full bg-opRed text-white font-bold py-4 rounded-xl shadow-lg hover:bg-red-700 active:scale-95 transition-all flex items-center justify-center gap-2">
                            <Icon name="check-circle" /> FINISH WORKOUT
                        </button>
                    </div>

                    {/* GLOBAL TIMER OVERLAY */}
                    <GlobalTimer 
                        initialTime={timerSeconds} 
                        isRunning={timerActive} 
                        onStop={() => { setTimerActive(false); setTimerSeconds(0); }}
                        onAdd={(amt) => setTimerSeconds(s => s + amt)}
                    />
                </div>
            );
        };

        // 4. DASHBOARD COMPONENT
        const Dashboard = ({ currentWeek, setCurrentWeek, onStartWorkout }) => {
            const [progress, setProgress] = useState(0);
            useEffect(() => setProgress((currentWeek / 20) * 100), [currentWeek]);

            return (
                <div className="flex-1 overflow-y-auto p-4 safe-pb">
                    <div className="bg-gradient-to-br from-opGray to-black border border-gray-800 rounded-2xl p-6 mb-6 shadow-xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-opRed opacity-5 blur-3xl rounded-full -mr-10 -mt-10"></div>
                        <h2 className="text-gray-400 text-xs font-bold uppercase tracking-widest mb-1">Current Phase</h2>
                        <h1 className="text-3xl font-bold text-white mb-4">{PROGRAM_DATA.blocks.find(b => b.weeks.includes(currentWeek))?.name || "Unknown"}</h1>
                        <div className="flex items-end gap-2 mb-2">
                            <span className="text-5xl font-bold text-opRed">W{currentWeek}</span>
                            <span className="text-gray-500 text-lg mb-1">/ 20</span>
                        </div>
                        <div className="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                            <div className="bg-opRed h-full transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                        </div>
                    </div>

                    <h3 className="text-white font-bold mb-4 flex items-center gap-2"><Icon name="calendar" size={18} /> This Week's Plan</h3>
                    <div className="grid grid-cols-2 gap-3 mb-8">
                        {[1, 2, 3, 5].map((day) => (
                            <button 
                                key={day}
                                onClick={() => onStartWorkout(day)}
                                className="bg-opGray p-4 rounded-xl border border-gray-800 hover:border-opRed transition-all text-left group relative overflow-hidden"
                            >
                                <div className="absolute right-2 top-2 opacity-0 group-hover:opacity-100 transition-opacity text-opRed">
                                    <Icon name="play-circle" size={20} />
                                </div>
                                <span className="text-xs text-gray-500 font-bold uppercase block mb-1">Day {day}</span>
                                <span className="text-sm font-semibold text-white leading-tight block truncate">
                                    {PROGRAM_DATA.getWorkout(currentWeek, day).title.split('(')[0]}
                                </span>
                            </button>
                        ))}
                    </div>

                    <div className="border-t border-gray-900 pt-6">
                        <div className="flex justify-between items-center">
                            <button onClick={() => setCurrentWeek(Math.max(1, currentWeek - 1))} className="p-3 bg-gray-900 rounded-lg hover:bg-gray-800">
                                <Icon name="chevron-left" />
                            </button>
                            <div className="text-center">
                                <span className="text-xs text-gray-500 uppercase block">Adjust Week</span>
                                <span className="text-white font-bold">Week {currentWeek}</span>
                            </div>
                            <button onClick={() => setCurrentWeek(Math.min(20, currentWeek + 1))} className="p-3 bg-gray-900 rounded-lg hover:bg-gray-800">
                                <Icon name="chevron-right" />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 5. APP ROOT
        const App = () => {
            const [view, setView] = useState("dashboard");
            const [currentWeek, setCurrentWeek] = useState(1);
            const [activeDay, setActiveDay] = useState(1);

            useEffect(() => {
                const savedWeek = localStorage.getItem('tracker_week');
                if (savedWeek) setCurrentWeek(parseInt(savedWeek));
                lucide.createIcons();
            }, []);

            useEffect(() => {
                localStorage.setItem('tracker_week', currentWeek);
            }, [currentWeek]);

            return (
                <div className="min-h-screen bg-opBlack text-opText font-sans flex flex-col max-w-md mx-auto border-x border-opGray shadow-2xl">
                    <Header 
                        title={view === "dashboard" ? "OnePlus 12 Tracker" : `Week ${currentWeek} Day ${activeDay}`} 
                        subtitle={view === "dashboard" ? "V26.10" : PROGRAM_DATA.getWorkout(currentWeek, activeDay).focus}
                        onBack={view === "workout" ? () => setView("dashboard") : null}
                    />
                    
                    {view === "dashboard" ? (
                        <Dashboard 
                            currentWeek={currentWeek} 
                            setCurrentWeek={setCurrentWeek}
                            onStartWorkout={(day) => { setActiveDay(day); setView("workout"); }}
                        />
                    ) : (
                        <WorkoutPlayer 
                            week={currentWeek} 
                            day={activeDay} 
                            onComplete={() => { alert("Workout Complete!"); setView("dashboard"); }} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
