<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OnePlus 12 Pro Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    colors: {
                        // Functional Palette (High Contrast OLED)
                        sys: {
                            black: '#000000',
                            surface: '#121212',
                            surfaceHigh: '#242424',
                            onSurface: '#FFFFFF',
                            onSurfaceVar: '#A1A1AA',
                            primary: '#FFFFFF', // High contrast active state
                            primaryDim: '#525252',
                            accent: '#3B82F6', // Electric Blue for action confirmation (better than aggressive red)
                            success: '#10B981',
                        }
                    },
                    boxShadow: {
                        'glass': '0 8px 32px 0 rgba(0, 0, 0, 0.37)',
                    },
                    animation: {
                        'slide-up': 'slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1)',
                    },
                    keyframes: {
                        slideUp: {
                            '0%': { transform: 'translateY(100%)' },
                            '100%': { transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000000; color: #FFFFFF; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
        ::-webkit-scrollbar { display: none; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 24px); }
        .safe-pt { padding-top: env(safe-area-inset-top, 24px); }
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        
        /* Glassmorphism for OLED depth */
        .glass-panel {
            background: rgba(18, 18, 18, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- HAPTIC ENGINE ---
        const useHaptic = () => {
            const trigger = (pattern = [10]) => {
                if (navigator.vibrate) {
                    navigator.vibrate(pattern);
                }
            };
            return {
                tick: () => trigger([10]), // Light tap for checks
                bump: () => trigger([30]), // Medium bump for buttons
                success: () => trigger([50, 50, 50]), // Double pulse for completion
                timer: () => trigger([200]) // Long buzz for timer
            };
        };

        // --- SWIPE HOOK ---
        const useSwipe = ({ onSwipeLeft, onSwipeRight, threshold = 50 }) => {
            const [touchStart, setTouchStart] = useState(null);
            const [touchEnd, setTouchEnd] = useState(null);

            const onTouchStart = (e) => {
                setTouchEnd(null);
                setTouchStart(e.targetTouches[0].clientX);
            };

            const onTouchMove = (e) => {
                setTouchEnd(e.targetTouches[0].clientX);
            };

            const onTouchEnd = () => {
                if (!touchStart || !touchEnd) return;
                const distance = touchStart - touchEnd;
                const isLeftSwipe = distance > threshold;
                const isRightSwipe = distance < -threshold;
                if (isLeftSwipe && onSwipeLeft) onSwipeLeft();
                if (isRightSwipe && onSwipeRight) onSwipeRight();
            };
            return { onTouchStart, onTouchMove, onTouchEnd };
        };

        // --- DATA LOADING (Using full data structure) ---
        const getFullSchedule = () => {
            const schedule = [];
            const add = (w, d, ex, s, r, n) => schedule.push({w, d, ex, s, r, n});
            // MOCK DATA - In production this is the full JSON
            for (let w = 1; w <= 21; w++) {
                [1, 5].forEach(d => {
                    if(w===21 && d===5) return;
                    add(w, d, "Rower (Zone 1)", 1, "2 min", "Warm-up");
                    add(w, d, "Band Pull-Aparts", 1, "20 reps", "Warm-up");
                });
                if (w <= 4) {
                    add(w, 1, "Pull-Up Ladders", 5, "(1-2-3)", "Volume");
                    add(w, 3, "RDL", 4, "8 reps", "Strength");
                    add(w, 5, "Weighted Pull-Ups", 3, "5 reps", "Intensity");
                } else {
                    add(w, 1, "Pull-Up EMOM", 8, "4 reps", "Density");
                    add(w, 3, "Goblet Squats", 3, "10 reps", "Legs");
                    add(w, 5, "Weighted Dips", 3, "5 reps", "Heavy");
                }
            }
            return schedule;
        };
        const FULL_DB = getFullSchedule();

        const PROGRAM_DATA = {
            blocks: [
                { id: 1, name: "Foundation", weeks: [1, 2, 3, 4] },
                { id: 2, name: "Intensification", weeks: [5, 6, 7, 8] },
                { id: 3, name: "Neutral Grip", weeks: [9, 10, 11, 12] },
                { id: 4, name: "Accumulation", weeks: [13, 14, 15, 16] },
                { id: 5, name: "Peak & Taper", weeks: [17, 18, 19, 20] },
                { id: 6, name: "Reload", weeks: [21] }
            ],
            getWorkout: (week, day) => {
                const dayExercises = FULL_DB.filter(i => i.w === week && i.d === day);
                if (dayExercises.length === 0) return { title: "Rest Day", sections: [] };
                const sections = { prep: [], skill: [], main: [], access: [], cool: [] };
                dayExercises.forEach(item => {
                    const n = item.n.toLowerCase();
                    let type = 'main';
                    if (n.includes('warm-up')) type = 'prep';
                    else if (n.includes('cool-down')) type = 'cool';
                    else if (item.ex.toLowerCase().includes('skill') || n.includes('practice')) type = 'skill';
                    else if (n.includes('accessory') || n.includes('core')) type = 'access';
                    sections[type].push({
                        name: item.ex,
                        prescription: `${item.s} x ${item.r}`,
                        notes: item.n,
                        sets: item.s,
                        rest: 90,
                        isBodyweight: !item.n.includes('kg')
                    });
                });
                const finalSections = [];
                const map = { prep: "Warm Up", skill: "Skill", main: "Main Work", access: "Accessory", cool: "Cool Down" };
                Object.keys(sections).forEach(k => {
                    if (sections[k].length > 0) finalSections.push({ type: k, name: map[k], exercises: sections[k] });
                });
                return { title: `Week ${week} Day ${day}`, sections: finalSections };
            }
        };

        // --- COMPONENTS ---

        // 1. OLED TOP BAR
        const TopAppBar = ({ title, subtitle, onBack, showBack }) => (
            <div className="bg-sys-black sticky top-0 z-40 safe-pt border-b border-white/5">
                <div className="h-16 flex items-center px-5 gap-4">
                    {showBack ? (
                        <button onClick={onBack} className="p-2 -ml-2 text-sys-onSurface rounded-full hover:bg-sys-surfaceHigh transition-colors">
                            <i data-lucide="arrow-left" width="24"></i>
                        </button>
                    ) : null}
                    
                    <div className="flex-1">
                        <h1 className="text-xl font-semibold text-sys-onSurface tracking-tight">{title}</h1>
                        {subtitle && <p className="text-xs text-sys-onSurfaceVar font-medium">{subtitle}</p>}
                    </div>
                </div>
            </div>
        );

        // 2. ACTION BAR (Reachability Optimized)
        // Instead of a top button or floating button, this sits directly above the nav bar
        // right where the thumb naturally rests on a large phone.
        const ActionBar = ({ onFinish, timerState, setTimerActive, setTimerSeconds }) => {
            const haptic = useHaptic();
            
            return (
                <div className="fixed bottom-[80px] left-0 right-0 p-4 z-40 pointer-events-none flex justify-end items-end gap-3 safe-pb">
                    {/* Timer Pill */}
                    {timerState.time > 0 && (
                        <div className="pointer-events-auto glass-panel px-4 py-3 rounded-full flex items-center gap-3 shadow-lg animate-slide-up mr-auto">
                            <span className="text-xl font-mono font-bold text-white">
                                {Math.floor(timerState.time/60)}:{timerState.time%60 < 10 ? '0' : ''}{timerState.time%60}
                            </span>
                            <div className="h-4 w-[1px] bg-white/20"></div>
                            <button onClick={() => { haptic.bump(); setTimerActive(false); setTimerSeconds(0); }} className="text-sys-onSurfaceVar hover:text-white">
                                <i data-lucide="x" width="20"></i>
                            </button>
                            <button onClick={() => { haptic.bump(); setTimerSeconds(s => s + 30); }} className="text-sys-accent font-bold text-sm">
                                +30s
                            </button>
                        </div>
                    )}

                    {/* Finish Button - Huge Touch Target */}
                    <button 
                        onClick={() => { haptic.success(); onFinish(); }} 
                        className="pointer-events-auto h-14 px-6 rounded-full bg-sys-onSurface text-sys-black font-bold shadow-lg flex items-center gap-2 active:scale-95 transition-transform"
                    >
                        <i data-lucide="check-circle-2" width="20"></i>
                        <span>FINISH</span>
                    </button>
                </div>
            );
        };

        // 3. BOTTOM NAV (Standard Android Layout)
        const NavigationBar = ({ activeTab, onTabChange }) => {
            const haptic = useHaptic();
            const navItems = [
                { id: 'train', icon: 'dumbbell', label: 'Train' },
                { id: 'history', icon: 'history', label: 'History' },
                { id: 'profile', icon: 'user', label: 'Profile' },
            ];

            return (
                <div className="fixed bottom-0 left-0 right-0 bg-sys-black border-t border-white/10 z-50 safe-pb h-[80px] flex items-center justify-around">
                    {navItems.map((item) => {
                        const isActive = activeTab === item.id;
                        return (
                            <button 
                                key={item.id} 
                                onClick={() => { haptic.tick(); onTabChange(item.id); }} 
                                className="flex flex-col items-center gap-1 w-full py-2 active:opacity-70"
                            >
                                <div className={`w-16 h-8 rounded-full flex items-center justify-center transition-all duration-200 ${isActive ? 'bg-sys-surfaceHigh' : 'transparent'}`}>
                                    <i data-lucide={item.icon} width="22" className={isActive ? 'text-white' : 'text-sys-onSurfaceVar'}></i>
                                </div>
                                <span className={`text-[11px] font-medium ${isActive ? 'text-white' : 'text-sys-onSurfaceVar'}`}>
                                    {item.label}
                                </span>
                            </button>
                        );
                    })}
                </div>
            );
        };

        // --- WORKOUT PLAYER ---
        const WorkoutPlayer = ({ week, day, onComplete }) => {
            const workout = useMemo(() => PROGRAM_DATA.getWorkout(week, day), [week, day]);
            const [logs, setLogs] = useState({});
            const [timerSeconds, setTimerSeconds] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const haptic = useHaptic();

            useEffect(() => {
                const saved = localStorage.getItem(`session_w${week}d${day}`);
                if (saved) setLogs(JSON.parse(saved));
                lucide.createIcons();
            }, [week, day]);

            useEffect(() => {
                let interval = null;
                if (timerActive && timerSeconds > 0) interval = setInterval(() => setTimerSeconds(s => s - 1), 1000);
                else if (timerSeconds === 0 && timerActive) { setTimerActive(false); haptic.timer(); }
                return () => clearInterval(interval);
            }, [timerActive, timerSeconds]);

            const saveLog = (id, field, value) => {
                const updatedLogs = { ...logs, [id]: { ...logs[id], [field]: value } };
                setLogs(updatedLogs);
                localStorage.setItem(`session_w${week}d${day}`, JSON.stringify(updatedLogs));
            };

            const toggleSet = (exId, setIndex, defaultSets) => {
                haptic.tick();
                const currentSets = logs[exId]?.sets || new Array(defaultSets).fill(false);
                const newSets = [...currentSets];
                while(newSets.length <= setIndex) newSets.push(false);
                newSets[setIndex] = !newSets[setIndex];
                saveLog(exId, 'sets', newSets);
            };

            const addSet = (exId, defaultSets) => {
                haptic.bump();
                const currentSets = logs[exId]?.sets || new Array(defaultSets).fill(false);
                saveLog(exId, 'sets', [...currentSets, false]);
            };

            const handleFinish = () => {
                const updatedLogs = { ...logs, completed: true, completedAt: new Date().toISOString(), week, day };
                setLogs(updatedLogs);
                localStorage.setItem(`session_w${week}d${day}`, JSON.stringify(updatedLogs));
                
                const history = JSON.parse(localStorage.getItem('global_history') || '[]');
                const cleanHistory = history.filter(h => !(h.week === week && h.day === day));
                cleanHistory.push({ week, day, date: new Date().toISOString(), title: workout.title });
                localStorage.setItem('global_history', JSON.stringify(cleanHistory));
                
                onComplete();
            };

            return (
                <div className="px-4 pb-40 pt-4">
                    {workout.sections.map((section, sIdx) => (
                        <div key={sIdx} className="mb-8">
                            <div className="flex items-center gap-3 mb-3">
                                <span className="text-xs font-bold text-sys-onSurfaceVar uppercase tracking-wider">{section.name}</span>
                                <div className="h-[1px] flex-1 bg-white/10"></div>
                            </div>
                            
                            <div className="space-y-4">
                                {section.exercises.map((ex, eIdx) => {
                                    const defaultSets = ex.sets || 3;
                                    const exId = ex.name.replace(/\s+/g, '_').toLowerCase();
                                    const currentSetArray = logs[exId]?.sets || new Array(defaultSets).fill(false);

                                    return (
                                        <div key={eIdx} className="bg-sys-surface rounded-2xl p-5 border border-white/5">
                                            <div className="flex justify-between items-start mb-5">
                                                <div className="flex-1 pr-4">
                                                    <h3 className="text-base font-semibold text-white leading-tight">{ex.name}</h3>
                                                    <p className="text-sm text-sys-onSurfaceVar mt-1 font-medium">{ex.prescription}</p>
                                                    {ex.notes && <p className="text-xs text-sys-accent mt-1">{ex.notes}</p>}
                                                </div>
                                                {ex.rest > 0 && (
                                                    <button 
                                                        onClick={() => { haptic.bump(); setTimerSeconds(ex.rest); setTimerActive(true); }} 
                                                        className="h-9 px-3 rounded-full bg-sys-surfaceHigh text-white text-xs font-bold flex items-center gap-1 active:bg-sys-onSurfaceVar transition-colors"
                                                    >
                                                        <i data-lucide="timer" width="14"></i> {ex.rest}s
                                                    </button>
                                                )}
                                            </div>
                                            
                                            {/* Interaction Area: Large Touch Targets */}
                                            <div className="flex flex-wrap gap-3 mb-4">
                                                {currentSetArray.map((isDone, i) => (
                                                    <button 
                                                        key={i} 
                                                        onClick={() => toggleSet(exId, i, defaultSets)} 
                                                        className={`h-12 w-12 rounded-full flex items-center justify-center text-sm font-bold transition-all duration-200 ${isDone ? 'bg-sys-accent text-white shadow-[0_0_15px_rgba(59,130,246,0.5)]' : 'bg-sys-surfaceHigh text-sys-onSurfaceVar'}`}
                                                    >
                                                        {isDone ? <i data-lucide="check" width="20" /> : i + 1}
                                                    </button>
                                                ))}
                                                <button onClick={() => addSet(exId, defaultSets)} className="h-12 w-12 rounded-full border border-dashed border-white/20 text-white/20 flex items-center justify-center active:bg-white/5">
                                                    <i data-lucide="plus" width="20"></i>
                                                </button>
                                            </div>

                                            {!ex.isBodyweight && (
                                                <div className="grid grid-cols-2 gap-4 pt-2 border-t border-white/5">
                                                    <div>
                                                        <label className="text-[10px] text-sys-onSurfaceVar uppercase font-bold mb-1 block">Load (kg)</label>
                                                        <input type="number" className="bg-sys-surfaceHigh rounded-lg w-full h-10 px-3 text-white font-mono text-sm outline-none focus:ring-1 focus:ring-sys-accent" 
                                                            value={logs[exId]?.weight || ''} onChange={(e) => saveLog(exId, 'weight', e.target.value)} placeholder="0" />
                                                    </div>
                                                    <div>
                                                        <label className="text-[10px] text-sys-onSurfaceVar uppercase font-bold mb-1 block">RPE</label>
                                                        <input type="number" className="bg-sys-surfaceHigh rounded-lg w-full h-10 px-3 text-white font-mono text-sm outline-none focus:ring-1 focus:ring-sys-accent" 
                                                            value={logs[exId]?.rpe || ''} onChange={(e) => saveLog(exId, 'rpe', e.target.value)} placeholder="-" />
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    ))}
                    <ActionBar onFinish={handleFinish} timerState={{time: timerSeconds}} setTimerActive={setTimerActive} setTimerSeconds={setTimerSeconds} />
                </div>
            );
        };

        // --- DASHBOARD ---
        const Dashboard = ({ currentWeek, setCurrentWeek, onStartWorkout }) => {
            const [progress, setProgress] = useState(0);
            const haptic = useHaptic();
            
            const swipeHandlers = useSwipe({
                onSwipeLeft: () => setCurrentWeek(Math.min(21, currentWeek + 1)),
                onSwipeRight: () => setCurrentWeek(Math.max(1, currentWeek - 1))
            });

            useEffect(() => setProgress((currentWeek / 21) * 100), [currentWeek]);

            const isCompleted = (day) => {
                try { return JSON.parse(localStorage.getItem(`session_w${currentWeek}d${day}`)).completed; } catch(e) { return false; }
            };

            const currentBlock = PROGRAM_DATA.blocks.find(b => b.weeks.includes(currentWeek)) || { name: "Unknown" };

            return (
                <div {...swipeHandlers} className="flex-1 overflow-y-auto px-5 pb-32 pt-6">
                    {/* High Contrast Phase Card */}
                    <div className="bg-sys-surfaceHigh rounded-3xl p-6 mb-8 relative overflow-hidden border border-white/5">
                        <div className="relative z-10">
                            <h2 className="text-xs font-bold text-sys-onSurfaceVar uppercase tracking-wider mb-1">Current Phase</h2>
                            <h1 className="text-3xl font-bold text-white mb-4">{currentBlock.name}</h1>
                            <div className="flex items-baseline gap-2 mb-6">
                                <span className="text-5xl font-bold text-sys-accent tracking-tighter">W{currentWeek}</span>
                                <span className="text-sys-onSurfaceVar font-mono text-lg">/ 21</span>
                            </div>
                            {/* Integrated Progress Bar */}
                            <div className="w-full bg-black/30 h-1.5 rounded-full overflow-hidden">
                                <div className="bg-sys-accent h-full transition-all duration-500" style={{ width: `${progress}%` }}></div>
                            </div>
                        </div>
                    </div>

                    <div className="flex justify-between items-end mb-5 px-1">
                        <h3 className="text-xl font-semibold text-white">Weekly Plan</h3>
                        <span className="text-xs text-sys-onSurfaceVar">Week {currentWeek}</span>
                    </div>

                    <div className="grid grid-cols-1 gap-3">
                        {[1, 2, 3, 5].map((day) => {
                            const done = isCompleted(day);
                            return (
                                <button key={day} onClick={() => { haptic.tick(); onStartWorkout(day); }} 
                                    className={`relative h-20 rounded-2xl px-5 flex items-center justify-between transition-all active:scale-[0.98] ${done ? 'bg-sys-success/10 border border-sys-success/20' : 'bg-sys-surface border border-white/5'}`}>
                                    
                                    <div className="flex flex-col items-start">
                                        <span className={`text-xs font-bold uppercase tracking-wider mb-0.5 ${done ? 'text-sys-success' : 'text-sys-onSurfaceVar'}`}>Day {day}</span>
                                        <span className="text-sm font-semibold text-white">{PROGRAM_DATA.getWorkout(currentWeek, day).sections[2]?.name || "Training"}</span>
                                    </div>

                                    <div className={`h-10 w-10 rounded-full flex items-center justify-center ${done ? 'bg-sys-success text-sys-black' : 'bg-sys-surfaceHigh text-sys-onSurfaceVar'}`}>
                                        {done ? <i data-lucide="check" width="20"></i> : <i data-lucide="chevron-right" width="20"></i>}
                                    </div>
                                </button>
                            );
                        })}
                    </div>
                    
                    {/* Simple Dot Indicator */}
                    <div className="mt-10 flex justify-center gap-3">
                        {[...Array(5)].map((_, i) => {
                            const dotWeek = currentWeek - 2 + i;
                            if (dotWeek < 1 || dotWeek > 21) return <div key={i} className="w-1.5 h-1.5" />;
                            return <div key={i} className={`w-1.5 h-1.5 rounded-full transition-colors ${dotWeek === currentWeek ? 'bg-white scale-125' : 'bg-white/20'}`}></div>
                        })}
                    </div>
                </div>
            );
        };

        const HistoryView = () => {
            const [history, setHistory] = useState([]);
            useEffect(() => {
                const h = JSON.parse(localStorage.getItem('global_history') || '[]');
                setHistory(h.sort((a, b) => new Date(b.date) - new Date(a.date)));
                lucide.createIcons();
            }, []);

            return (
                <div className="px-5 pb-32 pt-6">
                    <h2 className="text-xl font-semibold text-white mb-6">History</h2>
                    {history.length === 0 ? (
                        <div className="flex flex-col items-center justify-center py-20 text-sys-onSurfaceVar opacity-50">
                            <i data-lucide="history" width="40" className="mb-4"></i>
                            <p className="text-sm">No workouts yet</p>
                        </div>
                    ) : (
                        <div className="space-y-3">
                            {history.map((entry, idx) => (
                                <div key={idx} className="bg-sys-surface border border-white/5 rounded-2xl p-4 flex items-center gap-4">
                                    <div className="h-12 w-12 rounded-full bg-sys-surfaceHigh flex items-center justify-center text-xs font-bold text-white">
                                        W{entry.week}
                                    </div>
                                    <div className="flex-1">
                                        <h3 className="text-sm font-semibold text-white">Day {entry.day} Complete</h3>
                                        <p className="text-xs text-sys-onSurfaceVar mt-0.5">{new Date(entry.date).toLocaleDateString()}</p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [activeTab, setActiveTab] = useState('train');
            const [viewMode, setViewMode] = useState('tab'); 
            const [currentWeek, setCurrentWeek] = useState(1);
            const [activeDay, setActiveDay] = useState(1);

            useEffect(() => {
                const savedWeek = localStorage.getItem('tracker_week');
                if (savedWeek) setCurrentWeek(parseInt(savedWeek));
            }, []);

            useEffect(() => {
                localStorage.setItem('tracker_week', currentWeek);
            }, [currentWeek]);

            const startWorkout = (day) => {
                setActiveDay(day);
                setViewMode('workout');
            };

            return (
                <div className="min-h-screen bg-sys-black text-white font-sans flex flex-col max-w-md mx-auto relative">
                    <TopAppBar 
                        title={viewMode === 'workout' ? `Day ${activeDay}` : (activeTab === 'train' ? 'Dashboard' : activeTab === 'history' ? 'History' : 'Profile')}
                        subtitle={viewMode === 'workout' ? `Week ${currentWeek}` : (activeTab === 'train' ? 'OnePlus Strength' : '')}
                        showBack={viewMode === 'workout'}
                        onBack={() => setViewMode('tab')}
                    />

                    {viewMode === 'workout' ? (
                        <WorkoutPlayer week={currentWeek} day={activeDay} onComplete={() => setViewMode('tab')} />
                    ) : (
                        <>
                            {activeTab === 'train' && <Dashboard currentWeek={currentWeek} setCurrentWeek={setCurrentWeek} onStartWorkout={startWorkout} />}
                            {activeTab === 'history' && <HistoryView />}
                            {activeTab === 'profile' && <div className="p-10 text-center text-sys-onSurfaceVar">Settings coming soon.</div>}
                            <NavigationBar activeTab={activeTab} onTabChange={setActiveTab} />
                        </>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
