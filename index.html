<!DOCTYPE html>
<html lang="en" class="theme-light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, orientation=portrait">
    <title>OnePlus 12 Pro Tracker</title>

    <!-- PWA Meta Tags -->
    <meta name="description" content="21-week progressive strength training program with AI coaching">
    <meta name="theme-color" content="#f6f5f1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Tracker">

    <!-- Vendor-specific styling (force portrait on some Android/Chinese browsers) -->
    <meta name="screen-orientation" content="portrait">
    <meta name="x5-orientation" content="portrait">
    <meta name="browsermode" content="application">
    <meta name="x5-page-mode" content="app">

    <!-- PWA Icons - SVG preferred for scalability -->
    <link rel="icon" type="image/svg+xml" href="/tracker/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/tracker/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/tracker/favicon-16x16.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/tracker/apple-touch-icon.png">
    <link rel="mask-icon" href="/tracker/masked-icon.svg" color="#2f6b5e">

    <!-- Fonts - optimized loading with display=swap for better performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">

    <!-- Preload critical CSS -->
    <link rel="preload" href="colors.css" as="style">
    <link rel="stylesheet" href="colors.css">

    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
</head>
<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
