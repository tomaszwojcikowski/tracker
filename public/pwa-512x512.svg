<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background gradient - deep dark -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Primary accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- Subtle glow -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Inner highlight -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Subtle surface texture -->
  <rect width="512" height="512" rx="112" fill="url(#highlight)" opacity="0.5"/>

  <!-- Main icon group -->
  <g transform="translate(256, 256)">
    <!-- Stylized barbell/dumbbell - modern geometric -->

    <!-- Center bar -->
    <rect x="-100" y="-14" width="200" height="28" rx="14" fill="#3f3f46"/>
    <rect x="-100" y="-14" width="200" height="14" rx="7" fill="#52525b" opacity="0.5"/>

    <!-- Left weight stack -->
    <g filter="url(#glow)">
      <!-- Outer plate -->
      <rect x="-160" y="-56" width="40" height="112" rx="10" fill="url(#accent)"/>
      <!-- Inner plate -->
      <rect x="-130" y="-70" width="28" height="140" rx="8" fill="url(#accent)"/>
    </g>

    <!-- Right weight stack -->
    <g filter="url(#glow)">
      <!-- Inner plate -->
      <rect x="102" y="-70" width="28" height="140" rx="8" fill="url(#accent)"/>
      <!-- Outer plate -->
      <rect x="120" y="-56" width="40" height="112" rx="10" fill="url(#accent)"/>
    </g>

    <!-- Center grip lines -->
    <rect x="-30" y="-10" width="8" height="20" rx="4" fill="#52525b"/>
    <rect x="-10" y="-10" width="8" height="20" rx="4" fill="#52525b"/>
    <rect x="10" y="-10" width="8" height="20" rx="4" fill="#52525b"/>
    <rect x="30" y="-10" width="8" height="20" rx="4" fill="#52525b"/>
  </g>

  <!-- Progress indicator -->
  <g transform="translate(256, 420)">
    <!-- Track -->
    <rect x="-140" y="-5" width="280" height="10" rx="5" fill="#27272a"/>
    <!-- Progress fill -->
    <rect x="-140" y="-5" width="190" height="10" rx="5" fill="url(#accent)"/>
    <!-- Milestone dots -->
    <circle cx="-100" cy="0" r="3" fill="#fafafa" opacity="0.7"/>
    <circle cx="-20" cy="0" r="3" fill="#fafafa" opacity="0.7"/>
    <circle cx="60" cy="0" r="3" fill="#fafafa"/>
  </g>
</svg>
