<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a"/>
      <stop offset="100%" style="stop-color:#0a0a0a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444"/>
      <stop offset="100%" style="stop-color:#dc2626"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  
  <!-- Dumbbell icon -->
  <g transform="translate(256, 256)">
    <!-- Left weight plate -->
    <rect x="-180" y="-60" width="50" height="120" rx="8" fill="url(#accent)"/>
    <rect x="-150" y="-80" width="30" height="160" rx="6" fill="url(#accent)"/>
    
    <!-- Bar -->
    <rect x="-120" y="-15" width="240" height="30" rx="6" fill="#737373"/>
    
    <!-- Right weight plate -->
    <rect x="120" y="-80" width="30" height="160" rx="6" fill="url(#accent)"/>
    <rect x="130" y="-60" width="50" height="120" rx="8" fill="url(#accent)"/>
  </g>
  
  <!-- Progress indicator -->
  <rect x="80" y="400" width="352" height="8" rx="4" fill="#262626"/>
  <rect x="80" y="400" width="240" height="8" rx="4" fill="url(#accent)"/>
</svg>
