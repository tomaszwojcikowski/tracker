<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V26.10 Tracker</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        opBlack: '#000000',
                        opGray: '#121212',
                        opRed: '#EB0029',
                        opText: '#E5E5E5',
                        opSub: '#9CA3AF'
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #000000; color: #E5E5E5; -webkit-tap-highlight-color: transparent; }
        /* Custom Scrollbar for WebKit */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .safe-pb { padding-bottom: env(safe-area-inset-bottom, 20px); }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // --- DATA ENGINE (Based on your 20-Week Program File) ---
        
        const PROGRAM_DATA = {
            title: "20-Week Integrated Strength (V26.10)",
            blocks: [
                { id: 1, name: "Foundation", weeks: [1, 2, 3, 4] },
                { id: 2, name: "Intensification", weeks: [5, 6, 7, 8] },
                { id: 3, name: "Neutral Grip", weeks: [9, 10, 11, 12] },
                { id: 4, name: "Accumulation", weeks: [13, 14, 15, 16] },
                { id: 5, name: "Peak & Taper", weeks: [17, 18, 19, 20] }
            ],
            // Map specific logic for critical days based on the PDF
            getWorkout: (week, day) => {
                // DEFAULT TEMPLATE (Fallback)
                let workout = {
                    title: `Week ${week} Day ${day}`,
                    focus: "General Strength",
                    prep: ["Rower Protocol (5 min)", "Global Tendon Prep"],
                    sections: []
                };

                // LOGIC FOR BLOCK 1 (WEEKS 1-4)
                if (week <= 4) {
                    if (day === 1) {
                        // Calculate Ladder Sets based on Week
                        const ladderSets = week === 1 ? 4 : week === 4 ? 3 : 5;
                        
                        workout.title = "Pull Volume (Workout A)";
                        workout.focus = "Accumulation";
                        workout.sections = [
                            {
                                type: "skill",
                                name: "Skill Practice",
                                exercises: [{ name: "Crow Stand", prescription: "3 x 10-20s" }]
                            },
                            {
                                type: "main",
                                name: "Primary Work",
                                exercises: [
                                    { 
                                        id: "w1d1_a1",
                                        name: "A1. Pull-Up Ladders", 
                                        prescription: week === 1 ? "4 x (1-2-3) (24 reps)" : 
                                                      week === 2 ? "5 x (1-2-3) (30 reps)" : 
                                                      week === 3 ? "5 x (1-2-3) (30 reps)" : "3 x (1-2-3) (Deload)",
                                        inputs: ["ladders"], // Changed to ladders
                                        setCount: ladderSets // Dynamic set count
                                    },
                                    { id: "w1d1_b1", name: "B1. Ring Rows", prescription: "3 x 15", inputs: ["weight", "reps", "rpe"] },
                                    { id: "w1d1_b2", name: "B2. Incline Push-Ups", prescription: "3 x 10", inputs: ["weight", "reps", "rpe"] },
                                    { id: "w1d1_c1", name: "C1. Hollow Rocks", prescription: "3 x 25s", inputs: ["time"] }
                                ]
                            },
                            {
                                type: "cooldown",
                                name: "Cool Down",
                                exercises: [
                                    { name: "Passive Dead Hang", prescription: "30-60s (Decompress)" },
                                    { name: "Butcher's Block", prescription: "60s (Lats/Triceps)" },
                                    { name: "Cobra Stretch", prescription: "60s (Abs)" }
                                ]
                            }
                        ];
                    } else if (day === 2) {
                        workout.title = "Recovery & Mobility";
                        workout.focus = "Joint Health";
                        workout.sections = [
                            {
                                type: "main",
                                name: "Ankle & Shoulder",
                                exercises: [
                                    { name: "Knee-to-Wall Mob", prescription: "2 mins/side" },
                                    { name: "Tibialis Wall Raises", prescription: "3 x 15-20" },
                                    { name: "Deep Squat Iso-Hold", prescription: "2 x 30s" },
                                    { name: "Band Internal Rotations", prescription: "2 x 20/side" }
                                ]
                            }
                        ];
                    } else if (day === 3) {
                        workout.title = "Posterior Chain + Legs";
                        workout.focus = "Hinge Pattern";
                        workout.sections = [
                            {
                                type: "main",
                                name: "Strength",
                                exercises: [
                                    { id: "w1d3_a1", name: "A1. RDL", prescription: "4 x 8 @ ~85kg", inputs: ["weight", "reps", "rpe"] },
                                    { id: "w1d3_b1", name: "B1. Weighted Glute Bridge", prescription: "3 x 10-12", inputs: ["weight", "reps"] },
                                    { id: "w1d3_b2", name: "B2. Goblet Squats", prescription: week === 3 ? "3 x 10 (Heavier)" : "3 x 10 (Tech Focus)", inputs: ["weight", "reps"] },
                                    { id: "w1d3_c1", name: "C1. Face Pulls", prescription: "3 x 15-20", inputs: ["weight", "reps"] }
                                ]
                            }
                        ];
                    } else if (day === 5) {
                        workout.title = "Pull Intensity (Workout B)";
                        workout.focus = "Heavy Loading";
                        workout.sections = [
                            {
                                type: "skill",
                                name: "Skill Practice",
                                exercises: [{ name: "HSPU Volume", prescription: "3 x 3" }]
                            },
                            {
                                type: "main",
                                name: "Primary Lifts",
                                warning: "Double Progression Rule: Only add weight if all reps are perfect.",
                                exercises: [
                                    { 
                                        id: "w1d5_a1",
                                        name: "A1. Weighted Pull-Ups", 
                                        prescription: week === 4 ? "2 x 3 (50% Load)" : "3 x 5 (Double Prog)", 
                                        inputs: ["weight", "reps", "rpe"] 
                                    },
                                    { id: "w1d5_b1", name: "B1. Dips", prescription: "3 x 10 (BW)", inputs: ["weight", "reps"] }
                                ]
                            },
                            {
                                type: "main",
                                name: "Accessory Circuit (10m Cap)",
                                exercises: [
                                    { name: "Min 1: Split Squat (L)", prescription: "8 reps" },
                                    { name: "Min 2: Split Squat (R)", prescription: "8 reps" },
                                    { name: "Min 3: Wtd Hollow/V-Ups", prescription: "12-15 reps" }
                                ]
                            }
                        ];
                    }
                } 
                // LOGIC FOR BLOCK 2 (WEEKS 5-8) - Example Skeleton
                else if (week <= 8) {
                     if (day === 1) {
                        workout.title = "EMOM Volume";
                        workout.focus = "Density";
                        workout.sections = [
                             {
                                type: "main",
                                name: "EMOM Work",
                                exercises: [
                                    { name: "Pull-Up EMOM", prescription: week === 6 ? "9 x 4" : "8 x 4", inputs: ["completed"] }
                                ]
                             }
                        ]
                     }
                }

                return workout;
            }
        };

        // --- ICONS ---
        const Icon = ({ name, size = 24, className }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} className={className} width={size} height={size}></i>;
        };

        // --- COMPONENTS ---

        // 1. APP LAYOUT
        const Layout = ({ children }) => (
            <div className="min-h-screen bg-opBlack text-opText font-sans flex flex-col max-w-md mx-auto border-x border-opGray shadow-2xl">
                {children}
            </div>
        );

        // 2. HEADER
        const Header = ({ title, subtitle, onBack }) => (
            <div className="bg-opBlack border-b border-opGray p-4 sticky top-0 z-50 bg-opacity-95 backdrop-blur-md">
                <div className="flex items-center gap-4">
                    {onBack && (
                        <button onClick={onBack} className="p-2 bg-opGray rounded-full hover:bg-opRed transition-colors">
                            <Icon name="arrow-left" size={20} />
                        </button>
                    )}
                    <div>
                        <h1 className="text-lg font-bold text-white tracking-tight">{title}</h1>
                        {subtitle && <p className="text-xs text-opRed uppercase font-semibold tracking-widest">{subtitle}</p>}
                    </div>
                </div>
            </div>
        );

        // 3. WORKOUT PLAYER
        const WorkoutPlayer = ({ week, day, onComplete }) => {
            const workout = PROGRAM_DATA.getWorkout(week, day);
            const [logs, setLogs] = useState({});
            const [prepDone, setPrepDone] = useState({ rower: false, tendon: false });
            
            // Local Persistence for current session
            useEffect(() => {
                const savedkey = `session_w${week}d${day}`;
                const saved = localStorage.getItem(savedkey);
                if (saved) setLogs(JSON.parse(saved));
            }, [week, day]);

            const saveLog = (id, field, value) => {
                const newLogs = { ...logs, [id]: { ...logs[id], [field]: value } };
                setLogs(newLogs);
                localStorage.setItem(`session_w${week}d${day}`, JSON.stringify(newLogs));
            };

            return (
                <div className="flex-1 overflow-y-auto pb-20 safe-pb animate-in fade-in slide-in-from-bottom-4 duration-500">
                    <div className="p-4 space-y-6">
                        
                        {/* Safety / Prep Section */}
                        <div className="bg-opGray rounded-xl p-4 border border-gray-800">
                            <h3 className="text-sm font-bold text-opSub mb-3 uppercase">Pre-Flight Checks</h3>
                            <label className="flex items-center gap-3 mb-2 p-2 hover:bg-gray-900 rounded cursor-pointer">
                                <input type="checkbox" checked={prepDone.rower} onChange={() => setPrepDone(p => ({...p, rower: !p.rower}))} className="accent-opRed w-5 h-5" />
                                <span className={prepDone.rower ? "text-opRed line-through" : "text-white"}>Rower Protocol (5 min)</span>
                            </label>
                            <label className="flex items-center gap-3 p-2 hover:bg-gray-900 rounded cursor-pointer">
                                <input type="checkbox" checked={prepDone.tendon} onChange={() => setPrepDone(p => ({...p, tendon: !p.tendon}))} className="accent-opRed w-5 h-5" />
                                <span className={prepDone.tendon ? "text-opRed line-through" : "text-white"}>Global Tendon Prep</span>
                            </label>
                            {!prepDone.tendon && <p className="text-xs text-yellow-500 mt-2 ml-2">⚠ Required before touching a bar.</p>}
                        </div>

                        {/* Workout Sections */}
                        {workout.sections.map((section, sIdx) => (
                            <div key={sIdx} className="space-y-3">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-xl font-bold text-white">{section.name}</h2>
                                    <span className="text-xs px-2 py-1 bg-gray-800 rounded text-gray-400 uppercase">{section.type}</span>
                                </div>
                                {section.warning && (
                                    <div className="bg-red-900/20 border border-red-900/50 p-3 rounded text-xs text-red-200 flex gap-2">
                                        <Icon name="alert-triangle" size={16} />
                                        {section.warning}
                                    </div>
                                )}

                                {section.exercises?.map((ex, eIdx) => (
                                    <div key={eIdx} className="bg-opGray rounded-xl p-4 border border-gray-800 shadow-lg">
                                        <div className="flex justify-between items-start mb-2">
                                            <h3 className="font-bold text-lg text-white">{ex.name}</h3>
                                        </div>
                                        <div className="bg-black/50 p-2 rounded mb-4 border border-gray-800">
                                            <p className="text-sm text-opRed font-mono">{ex.prescription}</p>
                                        </div>

                                        {/* Input Fields */}
                                        {ex.inputs && (
                                            <div className="space-y-2">
                                                {/* Metric Inputs (Weight, Reps, RPE) */}
                                                {(ex.inputs.includes("weight") || ex.inputs.includes("reps") || ex.inputs.includes("rpe")) && (
                                                    <div className="grid grid-cols-3 gap-2">
                                                        {ex.inputs.includes("weight") && (
                                                            <div className="bg-black rounded p-2 border border-gray-800">
                                                                <label className="text-[10px] text-gray-500 uppercase block">Kg</label>
                                                                <input 
                                                                    type="number" 
                                                                    placeholder="0"
                                                                    value={logs[ex.id]?.weight || ''}
                                                                    onChange={(e) => saveLog(ex.id, 'weight', e.target.value)}
                                                                    className="bg-transparent text-white text-lg w-full focus:outline-none font-mono"
                                                                />
                                                            </div>
                                                        )}
                                                        {ex.inputs.includes("reps") && (
                                                            <div className="bg-black rounded p-2 border border-gray-800">
                                                                <label className="text-[10px] text-gray-500 uppercase block">Reps</label>
                                                                <input 
                                                                    type="number" 
                                                                    placeholder="0"
                                                                    value={logs[ex.id]?.reps || ''}
                                                                    onChange={(e) => saveLog(ex.id, 'reps', e.target.value)}
                                                                    className="bg-transparent text-white text-lg w-full focus:outline-none font-mono"
                                                                />
                                                            </div>
                                                        )}
                                                        {ex.inputs.includes("rpe") && (
                                                            <div className="bg-black rounded p-2 border border-gray-800">
                                                                <label className="text-[10px] text-gray-500 uppercase block">RPE</label>
                                                                <input 
                                                                    type="number" 
                                                                    placeholder="-"
                                                                    value={logs[ex.id]?.rpe || ''}
                                                                    onChange={(e) => saveLog(ex.id, 'rpe', e.target.value)}
                                                                    className="bg-transparent text-white text-lg w-full focus:outline-none font-mono"
                                                                />
                                                            </div>
                                                        )}
                                                    </div>
                                                )}

                                                {/* NEW: Ladder Inputs */}
                                                {ex.inputs.includes("ladders") && (
                                                    <div className="grid grid-cols-5 gap-2">
                                                        {Array.from({ length: ex.setCount || 4 }).map((_, i) => {
                                                            const isDone = (logs[ex.id]?.ladders || [])[i];
                                                            return (
                                                                <button
                                                                    key={i}
                                                                    onClick={() => {
                                                                        const currentLadders = logs[ex.id]?.ladders || [];
                                                                        const newLadders = [...currentLadders];
                                                                        newLadders[i] = !isDone;
                                                                        saveLog(ex.id, 'ladders', newLadders);
                                                                    }}
                                                                    className={`p-2 rounded text-xs font-bold border transition-all ${
                                                                        isDone
                                                                            ? 'bg-opRed border-opRed text-white shadow-[0_0_10px_rgba(235,0,41,0.4)]'
                                                                            : 'bg-transparent border-gray-700 text-gray-500 hover:border-gray-500'
                                                                    }`}
                                                                >
                                                                    Set {i + 1}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                        
                                        {/* Generic Completion Checkbox if no inputs */}
                                        {!ex.inputs && (
                                            <button 
                                                className={`w-full py-3 rounded font-bold text-sm transition-all ${logs[ex.name]?.done ? 'bg-green-900 text-green-100' : 'bg-gray-800 text-gray-400'}`}
                                                onClick={() => saveLog(ex.name, 'done', !logs[ex.name]?.done)}
                                            >
                                                {logs[ex.name]?.done ? "COMPLETED" : "MARK COMPLETE"}
                                            </button>
                                        )}
                                    </div>
                                ))}
                            </div>
                        ))}
                    </div>
                    <div className="p-4">
                        <button onClick={onComplete} className="w-full bg-opRed text-white font-bold py-4 rounded-xl shadow-lg hover:bg-red-700 active:scale-95 transition-all flex items-center justify-center gap-2">
                            <Icon name="check-circle" /> FINISH WORKOUT
                        </button>
                    </div>
                </div>
            );
        };

        // 4. DASHBOARD (HOME)
        const Dashboard = ({ currentWeek, setCurrentWeek, onStartWorkout }) => {
            const [progress, setProgress] = useState(0);

            useEffect(() => {
                // Mock calculation of progress
                setProgress((currentWeek / 20) * 100);
            }, [currentWeek]);

            return (
                <div className="flex-1 overflow-y-auto p-4 safe-pb">
                    {/* Status Card */}
                    <div className="bg-gradient-to-br from-opGray to-black border border-gray-800 rounded-2xl p-6 mb-6 shadow-xl relative overflow-hidden">
                        <div className="absolute top-0 right-0 w-32 h-32 bg-opRed opacity-5 blur-3xl rounded-full -mr-10 -mt-10"></div>
                        <h2 className="text-gray-400 text-xs font-bold uppercase tracking-widest mb-1">Current Phase</h2>
                        <h1 className="text-3xl font-bold text-white mb-4">{PROGRAM_DATA.blocks.find(b => b.weeks.includes(currentWeek))?.name || "Unknown"}</h1>
                        
                        <div className="flex items-end gap-2 mb-2">
                            <span className="text-5xl font-bold text-opRed">W{currentWeek}</span>
                            <span className="text-gray-500 text-lg mb-1">/ 20</span>
                        </div>
                        
                        {/* Week Progress Bar */}
                        <div className="w-full bg-gray-800 h-2 rounded-full overflow-hidden">
                            <div className="bg-opRed h-full transition-all duration-1000" style={{ width: `${progress}%` }}></div>
                        </div>
                    </div>

                    {/* Weekly Schedule */}
                    <h3 className="text-white font-bold mb-4 flex items-center gap-2"><Icon name="calendar" size={18} /> This Week's Plan</h3>
                    <div className="grid grid-cols-2 gap-3 mb-8">
                        {[1, 2, 3, 5].map((day) => (
                            <button 
                                key={day}
                                onClick={() => onStartWorkout(day)}
                                className="bg-opGray p-4 rounded-xl border border-gray-800 hover:border-opRed transition-all text-left group relative overflow-hidden"
                            >
                                <div className="absolute right-2 top-2 opacity-0 group-hover:opacity-100 transition-opacity text-opRed">
                                    <Icon name="play-circle" size={20} />
                                </div>
                                <span className="text-xs text-gray-500 font-bold uppercase block mb-1">Day {day}</span>
                                <span className="text-sm font-semibold text-white leading-tight block">
                                    {PROGRAM_DATA.getWorkout(currentWeek, day).title.split('(')[0]}
                                </span>
                            </button>
                        ))}
                    </div>

                    {/* Settings / Controls */}
                    <div className="border-t border-gray-900 pt-6">
                        <div className="flex justify-between items-center">
                            <button 
                                onClick={() => setCurrentWeek(Math.max(1, currentWeek - 1))}
                                className="p-3 bg-gray-900 rounded-lg hover:bg-gray-800"
                            >
                                <Icon name="chevron-left" />
                            </button>
                            <div className="text-center">
                                <span className="text-xs text-gray-500 uppercase block">Adjust Week</span>
                                <span className="text-white font-bold">Week {currentWeek}</span>
                            </div>
                            <button 
                                onClick={() => setCurrentWeek(Math.min(20, currentWeek + 1))}
                                className="p-3 bg-gray-900 rounded-lg hover:bg-gray-800"
                            >
                                <Icon name="chevron-right" />
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // 5. MAIN APP CONTAINER
        const App = () => {
            const [view, setView] = useState("dashboard"); // dashboard | workout
            const [currentWeek, setCurrentWeek] = useState(1);
            const [activeDay, setActiveDay] = useState(1);

            // Load persistence
            useEffect(() => {
                const savedWeek = localStorage.getItem('tracker_week');
                if (savedWeek) setCurrentWeek(parseInt(savedWeek));
                lucide.createIcons();
            }, []);

            useEffect(() => {
                localStorage.setItem('tracker_week', currentWeek);
            }, [currentWeek]);

            const startWorkout = (day) => {
                setActiveDay(day);
                setView("workout");
            };

            return (
                <Layout>
                    <Header 
                        title={view === "dashboard" ? "OnePlus 12 Tracker" : `Week ${currentWeek} Day ${activeDay}`} 
                        subtitle={view === "dashboard" ? "V26.10" : PROGRAM_DATA.getWorkout(currentWeek, activeDay).focus}
                        onBack={view === "workout" ? () => setView("dashboard") : null}
                    />
                    
                    {view === "dashboard" ? (
                        <Dashboard 
                            currentWeek={currentWeek} 
                            setCurrentWeek={setCurrentWeek}
                            onStartWorkout={startWorkout}
                        />
                    ) : (
                        <WorkoutPlayer 
                            week={currentWeek} 
                            day={activeDay} 
                            onComplete={() => {
                                alert("Workout Complete! Data saved locally.");
                                setView("dashboard");
                            }} 
                        />
                    )}
                </Layout>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
